version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: edith-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edith_user
      POSTGRES_PASSWORD: edith_password
      POSTGRES_DB: edith_db
    ports:
      - "5432:5432"
    volumes:
      - edith_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edith_user -d edith_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edith-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://edith_user:edith_password@postgres:5432/edith_db
      - SECRET_KEY=production-secure-random-secret-key-edith-core
      - AI_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  edith_pgdata:
